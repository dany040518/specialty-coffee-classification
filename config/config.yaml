# Configuración central del proyecto.
# Todas las rutas son RELATIVAS a la raíz del repositorio (nunca rutas absolutas tipo C:/Users/...).
# Los notebooks y los módulos de src/ deben leer sus parámetros de aquí, no hardcodearlos.

project:
  name: "Clasificación de café de especialidad (CQI)"
  random_seed: 42   # semilla única para todo split / validación cruzada / modelo que se implemente (fases 03-06)

paths:
  data:
    raw_dir: "data/raw"
    interim_dir: "data/interim"
    processed_dir: "data/processed"
    external_dir: "data/external"
    arabica_raw: "data/raw/arabica_data_cleaned.csv"
    robusta_raw: "data/raw/robusta_data_cleaned.csv"
  models_dir: "models"
  reports:
    figures_dir: "reports/figures"
    tables_dir: "reports/tables"
    dashboard_dir: "reports/dashboard"

# --- Variable objetivo y umbral de "café de especialidad" ---
# Decisión tomada en la fase 03 (ver notebooks/03_preparacion_de_los_datos.ipynb):
# se usa el umbral estándar de la industria (SCA - Specialty Coffee Association),
# que considera "specialty grade" a un lote con Total.Cup.Points >= 80. El único
# registro con Total.Cup.Points == 0 (dato corrupto, ver notebook 02) se elimina
# ANTES de aplicar este umbral (src/data/clean_data.py -> DropCorruptScores).
target:
  source_column: "Total.Cup.Points"
  target_column: "especialidad"
  specialty_threshold: 80

# --- Split train/test ---
# Estratificado por la variable objetivo, usando project.random_seed.
split:
  test_size: 0.2

# --- Hiperparámetros de modelos ---
# Cada clave corresponde a un modelo de src/models/train_model.py::MODEL_REGISTRY.
# Iteración actual: solo regresión logística (baseline). class_weight se deja en
# None porque el balanceo de clases ya lo maneja SMOTE dentro del pipeline de
# entrenamiento (src/models/train_model.py) — combinar SMOTE + class_weight
# sobre-corregiría el desbalance.
models:
  logistic_regression:
    max_iter: 1000
    C: 1.0
    class_weight: null
