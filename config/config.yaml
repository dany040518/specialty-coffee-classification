# Configuración central del proyecto.
# Todas las rutas son RELATIVAS a la raíz del repositorio (nunca rutas absolutas tipo C:/Users/...).
# Los notebooks y los módulos de src/ deben leer sus parámetros de aquí, no hardcodearlos.
#
# ENFOQUE: el proyecto es de aprendizaje NO supervisado (clustering). No hay
# variable objetivo. Se agrupan los lotes de café por sus atributos sensoriales
# de catación y luego se caracterizan esos grupos con variables de origen y
# manejo (ver notebooks/01_comprension_del_negocio.ipynb, secciones 1.2 y 1.4).

project:
  name: "Perfiles de calidad de café mediante clustering (CQI)"
  random_seed: 42   # semilla única para todo procedimiento con aleatoriedad:
                    # inicialización de k-means, submuestreos de estabilidad,
                    # proyecciones 2D, etc. (fases 03-06)

paths:
  data:
    raw_dir: "data/raw"
    interim_dir: "data/interim"
    processed_dir: "data/processed"
    external_dir: "data/external"
    arabica_raw: "data/raw/arabica_data_cleaned.csv"
    robusta_raw: "data/raw/robusta_data_cleaned.csv"
  models_dir: "models"
  reports:
    figures_dir: "reports/figures"
    tables_dir: "reports/tables"
    dashboard_dir: "reports/dashboard"

# --- Alcance de especies ---
# Decisión tomada en la fase 03 (notebooks/03_preparacion_de_los_datos.ipynb,
# sección 3.5): se trabaja SOLO con arabica. Robusta se descarta porque usa otro
# formulario de catación (Fine Robusta, atributos que no existen en arabica),
# tiene alta nulidad en variables de perfilado (Variety ~89 %, Processing.Method
# ~64 %, Moisture ~43 % en 0) y solo cuenta con 28 registros.
dataset:
  species: "arabica"   # "arabica" | "combined"

# --- Preparación de los datos (fase 03) ---
# Parámetros de limpieza, para no dejarlos como números mágicos en el notebook.
preparation:
  # Columnas que se eliminan: identificadores administrativos con alta nulidad y
  # columnas de altitud redundantes / de texto libre (ver fase 02, sección 2.7).
  drop_columns:
    - "Unnamed: 0"
    - "Lot.Number"
    - "Farm.Name"
    - "Mill"
    - "ICO.Number"
    - "Producer"
    - "Company"
    - "Altitude"
    - "altitude_low_meters"
    - "altitude_high_meters"
    - "Region"
  # Segundo grupo de columnas eliminadas en la fase 03 (sección 3.6): 'Species'
  # es constante (solo arabica), y el resto son datos administrativos del
  # proceso de certificación (identificadores, fechas, empaque) que no
  # describen el café ni sirven para agrupar o perfilar.
  drop_columns_admin:
    - "Species"
    - "Owner"
    - "Owner.1"
    - "Certification.Body"
    - "Certification.Address"
    - "Certification.Contact"
    - "In.Country.Partner"
    - "Grading.Date"
    - "Expiration"
    - "Bag.Weight"
    - "unit_of_measurement"
    - "Number.of.Bags"
  # altitude_mean_meters fuera de este rango (metros) -> NaN.
  altitude_valid_range: [200, 3000]
  # Moisture == 0 se trata como dato faltante (la humedad del grano nunca es 0 %).
  zero_as_missing: ["Moisture"]

# --- Clustering ---
clustering:
  # Atributos de catación SCA que ENTRAN al agrupamiento.
  # Nombres tal como aparecen en data/raw/arabica_data_cleaned.csv.
  # No se incluye 'Total.Cup.Points' porque es la suma de los subpuntajes.
  # Se dejaron FUERA 'Uniformity', 'Clean.Cup' y 'Sweetness' (fase 03, sección
  # 3.10): son casi constantes en 10 (ver fase 02 y sección 3.7.1), no separan
  # lotes. Quedan 7 atributos.
  features:
    - "Aroma"
    - "Flavor"
    - "Aftertaste"
    - "Acidity"
    - "Body"
    - "Balance"
    - "Cupper.Points"
  # Variables para DESCRIBIR / perfilar los grupos una vez formados.
  # NO entran al agrupamiento; se usan en las fases 05-06 y en el dashboard.
  profiling_features:
    - "Country.of.Origin"
    - "altitude_mean_meters"
    - "Variety"
    - "Processing.Method"
    - "Color"
    - "Harvest.Year"
  scaler: "standard"   # estandarización (media 0, desv. 1) antes de agrupar,
                       # para que ningún atributo pese más por su escala
  k_min: 2             # rango de número de grupos a evaluar en la fase 04
  k_max: 10
  # Algoritmos que se comparan en la fase 04 (sección 4.5), con sus parámetros
  # propios; lo que no aparezca aquí queda en los valores por defecto de
  # scikit-learn.
  algorithms:
    kmeans:
      n_init: 10        # nº de inicializaciones aleatorias; se conserva la mejor
    agglomerative: {}    # enlace 'ward' por defecto
    gaussian_mixture: {}
  # Reducción por PCA que se evalúa frente a los 7 atributos sin reducir
  # (fase 04, sección 4.4).
  pca:
    variance_target: 0.90                       # nº de componentes = las que acumulan >= 90 % de la varianza
    representations: ["7_atributos", "pca_2", "pca_4"]
  # Modelo elegido en la fase 04 (sección 4.6): PCA a 2 dimensiones + k-means
  # con 3 grupos. Lo usan `src/pipeline.py::train_clustering` y las fases 05-06.
  final:
    representation: "pca_2"   # "7_atributos" | "pca_2" | "pca_4"
    algorithm: "kmeans"       # "kmeans" | "agglomerative" | "gaussian_mixture"
    k: 3

# --- Validación de los grupos (fase 05) ---
validation:
  # Medidas de calidad de agrupamiento (no requieren etiqueta verdadera).
  internal_metrics:
    - "silhouette"          # métrica principal (ver notebook 01, sección 1.5)
    - "davies_bouldin"
    - "calinski_harabasz"
  # Columna que NO entra al clustering: se usa solo para CONTRASTAR los grupos
  # obtenidos contra la convención de la industria (café de especialidad).
  reference_column: "Total.Cup.Points"
  specialty_threshold: 80
  # Parámetros de las pruebas de estabilidad (fase 05, secciones 5.5-5.7).
  stability:
    n_seeds: 20              # nº de resiembras de k-means para medir cuánto cambian los grupos
    n_subsamples: 50         # nº de submuestras aleatorias
    subsample_fraction: 0.8  # proporción de lotes en cada submuestra

# --- Interpretación de los grupos (fase 06) ---
# Lo único de esta fase que es una decisión editorial y no un cálculo: cómo se
# llama cada grupo. Los nombres salen de leer el perfilado (notebook 06, sección
# 6.9) y viven acá para que el notebook, el módulo y el dashboard digan lo mismo.
# Las claves son las etiquetas que asignó k-means, que son arbitrarias: si se
# reentrena el modelo con otra configuración, hay que revisarlos.
interpretation:
  group_names:
    0: "Cafés de puntaje medio, lavados y latinoamericanos"
    1: "Cafés de puntaje más bajo, de fincas bajas y con más defectos"
    2: "Cafés de puntaje alto, de fincas altas y orígenes variados"
  # Ancho en puntos SCA de los tramos de `rango_puntaje` en el dataset del
  # dashboard. Los cortes se arman alrededor de validation.specialty_threshold:
  # dos tramos por debajo y dos por encima.
  score_band_width: 4
  # Cuántos valores se muestran por grupo en las tablas y figuras de perfilado
  # categórico (las tablas guardadas en reports/tables/ van completas).
  top_n_profiling: 6
